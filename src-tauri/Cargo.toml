[package]
name = "fuse"
version = "1.1.0-beta.1"
description = "Offline music library for Windows"
authors = ["Fuse"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fuse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
lofty = "0.24.0"
thiserror = "2"
walkdir = "2"
base64 = "0.22"
rodio = "0.22.2"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }
iroh = "0.35"
iroh-blobs = { version = "0.35", features = ["fs-store"] }
iroh-gossip = "0.35"
blake3 = "1"
hex = "0.4"
bytes = "1"
futures-lite = "2"

[dev-dependencies]
tempfile = "3"
